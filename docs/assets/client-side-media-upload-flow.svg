<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="972" aria-label="Upload flow: the client-side path (WASM worker processing plus the sideload endpoint) and the server-side path (POST /wp/v2/media plus PHP thumbnails) both converge at wp_generate_attachment_metadata." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1240 972"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#5c6470" d="M0 0 L10 5 L0 10 z"/></marker><style>.eyebrow{fill:#2d40e8;font-weight:700;font-size:13px;letter-spacing:1.5px}.title{fill:#101419;font-weight:800;font-size:34px}.subtitle{fill:#5c6470;font-size:19px}.body{fill:#3c434a;font-size:18px}.sub{fill:#5c6470;font-size:16px}.mono{font-family:ui-monospace,&apos;SF Mono&apos;,Menlo,Consolas,monospace}.lbl,.pill{font-weight:700}.pill{fill:#fff;font-size:20px}.lbl{font-size:13px;letter-spacing:1px}</style></defs><rect width="1240" height="972" fill="#fff"/><text x="40" y="52" class="eyebrow">CLIENT-SIDE MEDIA PROCESSING</text><text x="40" y="95" class="title">Upload flow</text><text x="40" y="128" class="subtitle">Both paths converge at <tspan class="mono" font-size="17">wp_generate_attachment_metadata</tspan>, so server-side hooks see the same surface either way.</text><rect width="470" height="54" x="385" y="172" fill="#1e1e1e" rx="27"/><text x="620" y="206" class="pill" text-anchor="middle">User uploads an image in the editor</text><line x1="620" x2="620" y1="226" y2="262" stroke="#5c6470" stroke-width="2" marker-end="url(#arrow)"/><rect width="640" height="92" x="300" y="266" fill="#fff" stroke="#2d40e8" stroke-width="2" rx="10"/><text x="620" y="303" fill="#101419" font-size="21" font-weight="700" text-anchor="middle">Client-side processing available?</text><text x="620" y="331" class="sub" text-anchor="middle">browser support + feature detection + not disabled</text><path fill="none" stroke="#5c6470" stroke-width="2" d="M620 358 L620 392 M310 392 L930 392"/><line x1="310" x2="310" y1="392" y2="448" stroke="#5c6470" stroke-width="2" marker-end="url(#arrow)"/><line x1="930" x2="930" y1="392" y2="448" stroke="#5c6470" stroke-width="2" marker-end="url(#arrow)"/><text x="90" y="428" fill="#8a8f98" class="lbl">IN THE BROWSER</text><text x="345" y="428" fill="#0a8043" class="lbl" font-size="15">Yes</text><text x="895" y="428" fill="#cc1818" class="lbl" font-size="15" text-anchor="end">No</text><text x="1150" y="428" fill="#8a8f98" class="lbl" text-anchor="end">ON THE SERVER</text><rect width="440" height="110" x="90" y="452" fill="#f4f5f6" stroke="#e4e6e8" stroke-width="1.5" rx="10"/><text x="310" y="491" class="body" text-anchor="middle">WASM worker decodes, resizes, and encodes the original</text><text x="310" y="517" class="body" text-anchor="middle">+ all thumbnails</text><text x="310" y="547" fill="#5566c9" class="body mono" text-anchor="middle">@wordpress/vips · libvips</text><rect width="440" height="110" x="710" y="452" fill="#f4f5f6" stroke="#e4e6e8" stroke-width="1.5" rx="10"/><text x="930" y="497" class="body" text-anchor="middle">File is POSTed to the server</text><text x="930" y="533" fill="#5566c9" class="body mono" text-anchor="middle">POST /wp/v2/media</text><line x1="310" x2="310" y1="562" y2="594" stroke="#5c6470" stroke-width="2" marker-end="url(#arrow)"/><line x1="930" x2="930" y1="562" y2="594" stroke="#5c6470" stroke-width="2" marker-end="url(#arrow)"/><rect width="440" height="100" x="90" y="598" fill="#f4f5f6" stroke="#e4e6e8" stroke-width="1.5" rx="10"/><text x="310" y="637" class="body" text-anchor="middle">Files uploaded via the sideload endpoint</text><text x="310" y="672" fill="#5566c9" class="body mono" text-anchor="middle">POST /wp/v2/media/{id}/sideload</text><rect width="440" height="100" x="710" y="598" fill="#f4f5f6" stroke="#e4e6e8" stroke-width="1.5" rx="10"/><text x="930" y="637" class="body" text-anchor="middle">PHP generates thumbnails</text><text x="930" y="671" class="sub" text-anchor="middle">GD or Imagick, as configured</text><path fill="none" stroke="#5c6470" stroke-width="2" d="M310 698 L310 726 M930 698 L930 726 M310 726 L930 726"/><line x1="620" x2="620" y1="726" y2="762" stroke="#5c6470" stroke-width="2" marker-end="url(#arrow)"/><rect width="880" height="92" x="180" y="766" fill="#eef0fc" stroke="#2d40e8" stroke-width="2" rx="10"/><text x="620" y="802" fill="#2d40e8" class="mono" font-size="21" font-weight="700" text-anchor="middle">wp_generate_attachment_metadata</text><text x="620" y="830" class="sub" text-anchor="middle">fired with context <tspan class="mono" font-size="15">&apos;update&apos;</tspan> — watermarking, CDN sync, and other plugins run here on both paths</text><line x1="620" x2="620" y1="858" y2="894" stroke="#5c6470" stroke-width="2" marker-end="url(#arrow)"/><rect width="430" height="54" x="405" y="898" fill="#1e1e1e" rx="27"/><text x="620" y="932" class="pill" text-anchor="middle">Attachment ready in the post</text></svg>