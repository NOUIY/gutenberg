<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" aria-label="Architecture overview: the block editor calls mediaUpload() from @wordpress/media-utils, which hands off to the @wordpress/upload-media store, which orchestrates the @wordpress/vips web worker and the REST API endpoints." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1240 760"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#5c6470" d="M0 0 L10 5 L0 10 z"/></marker><style>.eyebrow{fill:#2d40e8;font-weight:700;font-size:13px;letter-spacing:1.5px}.title{fill:#101419;font-weight:800;font-size:34px}.subtitle{fill:#5c6470;font-size:19px}.ct,.ctm{fill:#101419;font-weight:700;font-size:22px}.ctm{fill:#2d40e8;font-size:21px;font-family:ui-monospace,&apos;SF Mono&apos;,Menlo,Consolas,monospace}.body{fill:#3c434a;font-size:18px}.mono{font-family:ui-monospace,&apos;SF Mono&apos;,Menlo,Consolas,monospace}.bt{font-weight:700;font-size:12px;letter-spacing:1px}.ct-inv{fill:#fff}.body-inv{fill:#e8eaed}</style></defs><rect width="1240" height="760" fill="#fff"/><text x="40" y="52" class="eyebrow">CLIENT-SIDE MEDIA PROCESSING</text><text x="40" y="95" class="title">Architecture overview</text><text x="40" y="128" class="subtitle">The pipeline flows through three browser packages before reaching the server.</text><rect width="1160" height="88" x="40" y="172" fill="#fff" stroke="#dcdcde" stroke-width="1.5" rx="10"/><rect width="78" height="24" x="1106" y="190" fill="#e5e8fb" rx="6"/><text x="1145" y="207" fill="#2d40e8" class="bt" text-anchor="middle">BROWSER</text><text x="64" y="214" class="ct">Block editor</text><text x="64" y="242" class="body">Image, Gallery, and other media blocks call <tspan fill="#2d40e8" class="mono">mediaUpload()</tspan> from <tspan fill="#2d40e8" class="mono">@wordpress/block-editor</tspan></text><line x1="620" x2="620" y1="262" y2="296" stroke="#5c6470" stroke-width="2" marker-end="url(#arrow)"/><rect width="1160" height="88" x="40" y="300" fill="#fff" stroke="#dcdcde" stroke-width="1.5" rx="10"/><rect width="78" height="24" x="1106" y="318" fill="#e5e8fb" rx="6"/><text x="1145" y="335" fill="#2d40e8" class="bt" text-anchor="middle">BROWSER</text><text x="64" y="342" class="ctm">@wordpress/media-utils</text><text x="64" y="370" class="body"><tspan class="mono">uploadMedia()</tspan> / <tspan class="mono">sideloadMedia()</tspan> — HTTP transport to the REST API</text><line x1="620" x2="620" y1="390" y2="424" stroke="#5c6470" stroke-width="2" marker-end="url(#arrow)"/><rect width="1160" height="88" x="40" y="428" fill="#eef0fc" stroke="#2d40e8" stroke-width="2" rx="10"/><rect width="78" height="24" x="1106" y="446" fill="#dbe0fb" rx="6"/><text x="1145" y="463" fill="#2d40e8" class="bt" text-anchor="middle">BROWSER</text><text x="64" y="470" class="ctm">@wordpress/upload-media</text><text x="64" y="498" class="body"><tspan class="mono">core/upload-media</tspan> store — upload queue, concurrency limits, operation orchestration</text><path fill="none" stroke="#5c6470" stroke-width="2" d="M620 516 L620 544 M310 544 L930 544"/><line x1="310" x2="310" y1="544" y2="580" stroke="#5c6470" stroke-width="2" marker-end="url(#arrow)"/><line x1="930" x2="930" y1="544" y2="580" stroke="#5c6470" stroke-width="2" marker-end="url(#arrow)"/><rect width="540" height="140" x="40" y="584" fill="#fff" stroke="#dcdcde" stroke-width="1.5" rx="10"/><rect width="102" height="24" x="462" y="602" fill="#e5e8fb" rx="6"/><text x="513" y="619" fill="#2d40e8" class="bt" text-anchor="middle">WEB WORKER</text><text x="64" y="632" class="ctm">@wordpress/vips</text><text x="64" y="668" class="body">WASM image processing with libvips — decode, resize, crop,</text><text x="64" y="694" class="body">rotate, and encode off the main thread</text><rect width="540" height="150" x="660" y="584" fill="#1e1e1e" rx="10"/><rect width="70" height="24" x="1114" y="602" fill="#fff" rx="6"/><text x="1149" y="619" fill="#1e1e1e" class="bt" text-anchor="middle">SERVER</text><text x="684" y="632" class="ct ct-inv">REST API</text><text x="684" y="668" class="body mono body-inv">POST /wp/v2/media</text><text x="684" y="698" class="body mono body-inv">POST /wp/v2/media/{id}/sideload</text><text x="684" y="728" class="body mono body-inv">POST /wp/v2/media/{id}/finalize</text></svg>