<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" aria-label="The six-step processing pipeline: prepare, transcode (optional), upload the original, generate thumbnails, sideload sub-sizes, and finalize." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1240 740"><defs><style>.eyebrow{fill:#2d40e8;font-weight:700;font-size:13px;letter-spacing:1.5px}.title{fill:#101419;font-weight:800;font-size:34px}.subtitle{fill:#5c6470;font-size:19px}.st{fill:#101419;font-weight:700;font-size:22px}.body{fill:#3c434a;font-size:18px}.mono{font-family:ui-monospace,&apos;SF Mono&apos;,Menlo,Consolas,monospace}.num{fill:#fff;font-weight:700;font-size:19px}</style></defs><rect width="1240" height="740" fill="#fff"/><text x="40" y="52" class="eyebrow">CLIENT-SIDE MEDIA PROCESSING</text><text x="40" y="95" class="title">Processing pipeline</text><text x="40" y="128" class="subtitle">Operations chained sequentially per queue item by the <tspan class="mono" font-size="17">core/upload-media</tspan> store.</text><g stroke="#d0d5da" stroke-width="2"><line x1="62" x2="62" y1="226" y2="288"/><line x1="62" x2="62" y1="332" y2="368"/><line x1="62" x2="62" y1="412" y2="448"/><line x1="62" x2="62" y1="492" y2="554"/><line x1="62" x2="62" y1="598" y2="634"/></g><g><circle cx="62" cy="204" r="22" fill="#2d40e8"/><text x="62" y="211" class="num" text-anchor="middle">1</text><circle cx="62" cy="310" r="22" fill="#2d40e8"/><text x="62" y="317" class="num" text-anchor="middle">2</text><circle cx="62" cy="390" r="22" fill="#2d40e8"/><text x="62" y="397" class="num" text-anchor="middle">3</text><circle cx="62" cy="470" r="22" fill="#2d40e8"/><text x="62" y="477" class="num" text-anchor="middle">4</text><circle cx="62" cy="576" r="22" fill="#2d40e8"/><text x="62" y="583" class="num" text-anchor="middle">5</text><circle cx="62" cy="656" r="22" fill="#2d40e8"/><text x="62" y="663" class="num" text-anchor="middle">6</text></g><text x="105" y="200" class="st">Prepare</text><text x="105" y="230" class="body">Inspect the file type and pick a pipeline — supported images go through WASM; video, audio, and documents</text><text x="105" y="256" class="body">upload directly for server-side processing.</text><text x="105" y="306" class="st">Transcode</text><rect width="86" height="24" x="238" y="288" fill="#fdf0d5" rx="5"/><text x="281" y="305" fill="#9a6700" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">OPTIONAL</text><text x="105" y="336" class="body">Convert formats per the <tspan class="mono">image_editor_output_format</tspan> filter (e.g. JPEG → WebP). Transparent PNGs are never converted to JPEG.</text><text x="105" y="386" class="st">Upload the original</text><text x="105" y="416" class="body"><tspan class="mono">POST /wp/v2/media</tspan> with <tspan class="mono">generate_sub_sizes: false</tspan> — the server skips thumbnail generation entirely.</text><text x="105" y="466" class="st">Generate thumbnails</text><text x="105" y="496" class="body">The server responds with <tspan class="mono">missing_image_sizes</tspan>; the client resizes each one, deduplicating sizes that share output dimensions. Scaled</text><text x="105" y="522" class="body">(<tspan class="mono">big_image_size_threshold</tspan>) and EXIF-rotated versions are generated here too.</text><text x="105" y="572" class="st">Sideload sub-sizes</text><text x="105" y="602" class="body">Each variant uploads via <tspan class="mono">POST /wp/v2/media/{id}/sideload</tspan>. Sideloads to the same post are serialized to avoid metadata races.</text><text x="105" y="652" class="st">Finalize</text><text x="105" y="682" class="body"><tspan class="mono">POST /wp/v2/media/{id}/finalize</tspan> fires <tspan class="mono">wp_generate_attachment_metadata</tspan> with context <tspan class="mono">&apos;update&apos;</tspan></text><text x="105" y="708" class="body">so server-side plugins see the complete sub-size metadata. Best-effort: a failure here never blocks the upload.</text></svg>