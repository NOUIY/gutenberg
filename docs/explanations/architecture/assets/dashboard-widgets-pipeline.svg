<svg xmlns="http://www.w3.org/2000/svg" aria-label="The widget pipeline: from the widgets folder, through the build and the server registry, to the client package and hosts" role="img" viewBox="0 0 912 656"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 1 L 8 5 L 0 9 z"/></marker></defs><rect width="900" height="644" x="6" y="6" fill="#fff" rx="12"/><rect width="480" height="66" x="216" y="30" fill="#e2ecfd" stroke="#2f54a5" stroke-width="1.5" rx="9"/><text x="240" y="57" fill="#1e3a8a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700">widgets/&lt;name&gt;/</text><text x="240" y="78" fill="#2f54a5" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" opacity=".85">authoring · one folder per widget · widget.json + widget.ts + render.tsx</text><line x1="456" x2="456" y1="96" y2="134" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="472" y="120" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">build time</text><rect width="480" height="66" x="216" y="136" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" rx="9"/><text x="240" y="163" fill="#334155" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700">@wordpress/build</text><text x="240" y="184" fill="#475569" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" opacity=".9">discovers folders · two ES script modules per widget · emits the PHP manifest</text><line x1="456" x2="456" y1="202" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="472" y="226" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">init (PHP)</text><rect width="480" height="66" x="216" y="242" fill="#fff3d0" stroke="#b07020" stroke-width="1.5" rx="9"/><text x="240" y="269" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-