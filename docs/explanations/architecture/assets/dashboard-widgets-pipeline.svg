, plugin panel…</tspan></text><text x="240" y="608" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" opacity=".9">owns layout · chrome · persistence</text><line x1="730" x2="730" y1="34" y2="410" stroke="#cbd5e1" stroke-width="1.2"/><line x1="730" x2="722" y1="34" y2="34" stroke="#cbd5e1" stroke-width="1.2"/><line x1="730" x2="722" y1="410" y2="410" stroke="#cbd5e1" stroke-width="1.2"/><text x="742" y="218" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="11">WordPress</text><text x="742" y="233" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="11">infrastructure</text><line x1="730" x2="730" y1="458" y2="516" stroke="#7fc4b3" stroke-width="1.2"/><line x1="730" x2="722" y1="458" y2="458" stroke="#7fc4b3" stroke-width="1.2"/><line x1="730" x2="722" y1="516" y2="516" stroke="#7fc4b3" stroke-width="1.2"/><text x="742" y="484" fill="#2b8d79" font-family="-apple-system, system-ui, sans-serif" font-size="11">the shared</text><text x="742" y="499" fill="#2b8d79" font-family="-apple-system, system-ui, sans-serif" font-size="11">contract</text><line x1="730" x2="730" y1="564" y2="622" stroke="#cbd5e1" stroke-width="1.2"/><line x1="730" x2="722" y1="564" y2="564" stroke="#cbd5e1" stroke-width="1.2"/><line x1="730" x2="722" y1="622" y2="622" stroke="#cbd5e1" stroke-width="1.2"/><text x="742" y="590" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="11">host</text><text x="742" y="605" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="11">territory</text></svg>