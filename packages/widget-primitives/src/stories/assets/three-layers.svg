<svg xmlns="http://www.w3.org/2000/svg" aria-label="The three layers a widget declares and how the host treats each: identity is copied and shown verbatim, framing is translated and materialized the host's own way, representation is rendered and mounted without interpretation." role="img" viewBox="0 0 860 330"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 1 L 8 5 L 0 9 z"/></marker></defs><rect width="848" height="318" x="6" y="6" fill="#fff" rx="12"/><text x="196" y="40" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">the widget declares</text><text x="688" y="40" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">the host</text><rect width="304" height="74" x="44" y="58" fill="#e2ecfd" stroke="#2f54a5" stroke-width="1.5" rx="9"/><text x="64" y="88" fill="#1e3a8a" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">Identity</text><text x="64" y="108" fill="#2f54a5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">name · title · description · help</text><text x="64" y="122" fill="#2f54a5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">icon · category · keywords</text><line x1="352" x2="556" y1="95" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="454" y="86" fill="#1e3a8a" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" text-anchor="middle">copied</text><rect width="256" height="74" x="560" y="58" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4" rx="9"/><text x="578" y="90" fill="#475569" font-family="-apple-system, system-ui, sans-serif" font-size="12">shows it verbatim</text><text x="578" y="110" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10.5">decides where, not what</text><rect width="304" height="74" x="44" y="144" fill="#d7f0ea" stroke="#1d6b5a" stroke-width="1.5" rx="9"/><text x="64" y="174" fill="#1d6b5a" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">Framing</text><text x="64" y="197" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5">presentation</text><line x1="352" x2="556" y1="181" y2="181" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="454" y="172" fill="#1d6b5a" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" text-anchor="middle">translated</text><rect width="256" height="74" x="560" y="144" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4" rx="9"/><text x="578" y="176" fill="#475569" font-family="-apple-system, system-ui, sans-serif" font-size="12">materializes it its own way</text><text x="578" y="196" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10.5">honor, map, or ignore</text><rect width="304" height="74" x="44" y="230" fill="#fff3d0" stroke="#b07020" stroke-width="1.5" rx="9"/><text x="64" y="260" fill="#855317" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">Representation</text><text x="64" y="283" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5">attributes · actions · example · render</text><line x1="352" x2="556" y1="267" y2="267" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="454" y="258" fill="#855317" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" text-anchor="middle">rendered</text><rect width="256" height="74" x="560" y="230" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4" rx="9"/><text x="578" y="262" fill="#475569" font-family="-apple-system, system-ui, sans-serif" font-size="12">mounts it, no interpretation</text><text x="578" y="282" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10.5">provides the container</text></svg>