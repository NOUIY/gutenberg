<svg xmlns="http://www.w3.org/2000/svg" aria-label="In full-bleed presentation, the widget owns the whole tile edge to edge, and the host keeps its identity header in a VisuallyHidden node for accessibility instead of painting it." role="img" viewBox="0 0 760 360"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 1 L 8 5 L 0 9 z"/></marker><clipPath id="tileClip"><rect width="372" height="210" x="308" y="86" rx="10"/></clipPath><linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#e3edfb"/></linearGradient></defs><rect width="748" height="348" x="6" y="6" fill="#fff" rx="12"/><text x="380" y="42" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">In full-bleed, the widget owns the tile; identity stays hidden, kept for a11y.</text><rect width="172" height="128" x="40" y="116" fill="#e2ecfd" stroke="#2f54a5" stroke-width="1.5" rx="10"/><text x="60" y="144" fill="#1e3a8a" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700">Identity</text><text x="60" y="162" fill="#2f54a5" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" opacity=".8">metadata</text><rect width="18" height="18" x="60" y="176" fill="#2f54a5" rx="4"/><text x="86" y="190" fill="#2f54a5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">icon</text><text x="60" y="220" fill="#2f54a5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">title: Welcome</text><line x1="212" x2="300" y1="150" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="256" y="140" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">host reads</text><g clip-path="url(#tileClip)"><rect width="372" height="210" x="308" y="86" fill="url(#sky)"/><circle cx="602" cy="152" r="46" fill="#c3d9f5" opacity=".7"/><path fill="#d7f0ea" d="M308 296 L308 252 Q 430 216 560 246 Q 642 264 680 240 L680 296 Z"/><path fill="#bfe3d8" d="M308 296 L308 274 Q 452 246 592 270 Q 652 280 680 266 L680 296 Z"/></g><rect width="372" height="210" x="308" y="86" fill="none" stroke="#cbd5e1" stroke-width="1.5" rx="10"/><rect width="190" height="46" x="320" y="98" fill="#fff" fill-opacity=".82" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="1.3" rx="8"/><rect width="16" height="16" x="332" y="108" fill="none" stroke="#94a3b8" stroke-width="1.3" rx="4"/><text x="356" y="120" fill="#475569" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600">icon + Welcome</text><text x="332" y="136" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic">VisuallyHidden · a11y</text><text x="494" y="322" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" text-anchor="middle">presentation: full-bleed</text></svg>