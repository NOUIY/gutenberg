<svg xmlns="http://www.w3.org/2000/svg" aria-label="The application registers the field type vocabulary once at init; the widget references a type by name; resolveFields, inside useWidgetTypes, is the only point that recognizes the name and translates it into plain DataViews field props; DataForm then renders the control in the chrome header and the settings surface. Unregistered names pass through and degrade silently as unknown types." role="img" viewBox="0 0 920 400"><defs><marker id="arrow-ftp" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 1 L 8 5 L 0 9 z"/></marker><marker id="arrow-ftp-green" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#1d6b5a" d="M 0 1 L 8 5 L 0 9 z"/></marker></defs><rect width="908" height="388" x="6" y="6" fill="#fff" rx="12"/><text x="460" y="38" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Widgets reference a name; the application defines what it means.</text><rect width="268" height="88" x="336" y="64" fill="#d7f0ea" stroke="#1d6b5a" stroke-width="1.5" rx="9"/><text x="470" y="90" fill="#1d6b5a" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">application registry</text><text x="470" y="105" fill="#3c5a52" font-family="-apple-system, system-ui, sans-serif" font-size="10" text-anchor="middle">registered once, before render</text><rect width="232" height="28" x="354" y="114" fill="#fff" stroke="#1d6b5a" stroke-width="1.2" rx="5"/><text x="470" y="132" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" text-anchor="middle">location → { baseType, Edit }</text><line x1="470" x2="470" y1="156" y2="190" stroke="#1d6b5a" stroke-width="1.5" marker-end="url(#arrow-ftp-green)"/><rect width="50" height="14" x="480" y="163" fill="#fff" rx="3"