<svg xmlns="http://www.w3.org/2000/svg" aria-label="Each attribute may carry a relevance hint. The widget declares importance; the host may promote high-relevance fields to a prominent surface and edit the rest through a settings surface built from the schema." role="img" viewBox="0 0 920 400"><defs><marker id="arrow-relevance" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 1 L 8 5 L 0 9 z"/></marker><marker id="arrow-relevance-high" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#1d6b5a" d="M 0 1 L 8 5 L 0 9 z"/></marker></defs><rect width="908" height="388" x="6" y="6" fill="#fff" rx="12"/><g transform="translate(460 205) scale(1.1) translate(-460 -205)"><text x="460" y="42" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">The widget declares importance; the host chooses the surface.</text><rect width="260" height="180" x="48" y="80" fill="#fff3d0" stroke="#b07020" stroke-width="1.5" rx="9"/><text x="68" y="110" fill="#855317" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">attributes</text><text x="68" y="128" fill="#855317" font-family="-apple-system, system-ui, sans-serif" font-size="11" opacity=".8">declarative schema</text><rect width="220" height="46" x="68" y="144" fill="#fff" stroke="#b07020" stroke-width="1.2" rx="5"/><text x="80" y="164" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">location</text><text x="80" y="180" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="700">relevance: high</text><rect width="220" height="46" x="68" y="200" fill="#fff" stroke="#e2c88a" stroke-width="1.2" rx="5"/><text x="80" y="220" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">perPage</text><text x="80" y="236" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">low (default)</text><rect width="184" height="88" x="368" y="96" fill="#fafbfc" stroke="#1d6b5a" stroke-dasharray="6 5" stroke-width="1.5" rx="9"/><text x="460" y="122" fill="#1d6b5a" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">prominent surface</text><text x="460" y="138" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="10" text-anchor="middle">host may promote</text><rect width="136" height="18" x="392" y="152" fill="#fff" stroke="#1d6b5a" stroke-width="1.2" rx="3"/><text x="460" y="165" fill="#1d6b5a" font-family="ui-monospace, monospace" font-size="9.5" text-anchor="middle">high fields</text><rect width="184" height="108" x="368" y="204" fill="#fafbfc" stroke="#94a3b8" stroke-dasharray="6 5" stroke-width="1.5" rx="9"/><text x="460" y="230" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">settings surface</text><text x="460" y="246" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="10" text-anchor="middle">full schema form</text><rect width="136" height="16" x="392" y="260" fill="#fff" stroke="#e2e8f0" stroke-width="1.2" rx="3"/><rect width="136" height="16" x="392" y="282" fill="#fff" stroke="#e2e8f0" stroke-width="1.2" rx="3"/><path fill="none" stroke="#1d6b5a" stroke-width="1.5" marker-end="url(#arrow-relevance-high)" d="M 288 167 L 364 136"/><rect width="28" height="14" x="318" y="144" fill="#fff" rx="3"/><text x="332" y="155" fill="#1d6b5a" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" text-anchor="middle">high</text><path fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-relevance)" d="M 288 223 L 364 262"/><rect width="26" height="14" x="318" y="236" fill="#fff" rx="3"/><text x="331" y="247" fill="#64748b" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" text-anchor="middle">low</text><rect width="184" height="168" x="624" y="112" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" rx="9"/><path fill="#f1f5f9" d="M 633 114 H 799 Q 806 114 806 121 V 151 H 626 V 121 Q 626 114 633 114 Z"/><line x1="624" x2="808" y1="151" y2="151" stroke="#e2e8f0" stroke-width="1"/><rect width="18" height="18" x="642" y="122" fill="#2f54a5" rx="4"/><text x="668" y="135" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700">Events</text><rect width="58" height="16" x="734" y="124" fill="#d7f0ea" stroke="#1d6b5a" stroke-width="1" rx="4"/><text x="763" y="136" fill="#1d6b5a" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">location</text><rect width="12" height="12" x="642" y="168" fill="#e2e8f0" rx="3"/><line x1="662" x2="758" y1="174" y2="174" stroke="#cbd5e1" stroke-width="1.5"/><rect width="12" height="12" x="642" y="190" fill="#e2e8f0" rx="3"/><line x1="662" x2="728" y1="196" y2="196" stroke="#cbd5e1" stroke-width="1.5"/><text x="716" y="256" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-style="italic" text-anchor="middle">widget render</text><rect width="44" height="26" x="566" y="100" fill="#fff" rx="3"/><text x="588" y="111" fill="#1d6b5a" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">near</text><text x="588" y="121" fill="#1d6b5a" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">instance</text><line x1="552" x2="620" y1="135" y2="135" stroke="#1d6b5a" stroke-width="1.5" marker-end="url(#arrow-relevance-high)"/><text x="460" y="360" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" text-anchor="middle">importance, not surface. absent means low</text></g></svg>