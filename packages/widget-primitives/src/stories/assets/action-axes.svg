<svg xmlns="http://www.w3.org/2000/svg" aria-label="A widget declares one action as pure data: an envelope of id and label, plus exactly one fulfillment, chosen by the key it writes. That fixes what triggering the action means. Two decisions are left to the host: the materialization, which primitive it mounts, which must be a real link primitive wherever the surface allows one; and the placement, where the affordance goes." role="img" viewBox="0 0 880 360"><defs><marker id="arrow-aa" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 1 L 8 5 L 0 9 z"/></marker></defs><rect width="868" height="348" x="6" y="6" fill="#fff" rx="12"/><text x="440" y="38" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">What the declaration fixes, and what the host decides.</text><text x="170" y="68" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">the widget declares</text><text x="626" y="68" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">the host decides</text><rect width="252" height="200" x="44" y="100" fill="#fff3d0" stroke="#b07020" stroke-width="1.5" rx="9"/><text x="64" y="128" fill="#855317" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">action</text><rect width="216" height="124" x="62" y="140" fill="#fff" stroke="#b07020" stroke-width="1.2" rx="5"/><text x="74" y="158" fill="#b07020" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" opacity=".7">envelope</text><text x="74" y="178" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">id: &apos;view-report&apos;</text><text x="74" y="196" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">label: &apos;View report&apos;</text><line x1="70" x2="270" y1="208" y2="208" stroke="#e8cf9e" stroke-width="1"/><text x="74" y="226" fill="#b07020" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" opacity=".7">fulfillment</text><text x="74" y="246" fill="#b07020" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="700">href: &apos;site-health.php&apos;</text><text x="64" y="284" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic">pure data · the key names the fulfillment</text><line x1="300" x2="412" y1="200" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-aa)"/><line x1="300" x2="412" y1="200" y2="246" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-aa)"/><rect width="420" height="76" x="416" y="116" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4" rx="9"/><text x="436" y="142" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700">materialization</text><text x="436" y="161" fill="#475569" font-family="-apple-system, system-ui, sans-serif" font-size="11">which primitive the host mounts</text><text x="436" y="179" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">a real link primitive wherever the surface allows one</text><rect width="420" height="76" x="416" y="208" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4" rx="9"/><text x="436" y="234" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700">placement</text><text x="436" y="253" fill="#475569" font-family="-apple-system, system-ui, sans-serif" font-size="11">where the affordance goes</text><text x="436" y="271" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">More menu, footer, command palette</text><text x="440" y="326" fill="#855317" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" text-anchor="middle">declared once · fulfilled one way · materialized per surface · placed by the host</text></svg>