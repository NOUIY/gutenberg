<svg xmlns="http://www.w3.org/2000/svg" aria-label="In content-bleed presentation, the host still paints the identity header, but the widget's content fills its area edge to edge with no padding. Shown with the Quick Draft widget." role="img" viewBox="0 0 760 360"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#94a3b8" d="M 0 1 L 8 5 L 0 9 z"/></marker><clipPath id="cbTileClip"><rect width="372" height="210" x="308" y="86" rx="10"/></clipPath></defs><rect width="748" height="348" x="6" y="6" fill="#fff" rx="12"/><text x="380" y="42" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">In content-bleed, the header stays, but content fills its area edge to edge.</text><rect width="172" height="128" x="40" y="116" fill="#e2ecfd" stroke="#2f54a5" stroke-width="1.5" rx="10"/><text x="60" y="144" fill="#1e3a8a" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700">Identity</text><text x="60" y="162" fill="#2f54a5" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" opacity=".8">metadata</text><rect width="18" height="18" x="60" y="176" fill="#2f54a5" rx="4"/><text x="86" y="190" fill="#2f54a5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">icon</text><text x="60" y="220" fill="#2f54a5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">title: Quick Draft</text><line x1="212" x2="300" y1="150" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/><text x="256" y="140" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">host reads</text><rect width="372" height="210" x="308" y="86" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" rx="10"/><path fill="#f1f5f9" d="M 318 88 H 670 Q 678 88 678 96 V 137 H 310 V 96 Q 310 88 318 88 Z"/><line x1="308" x2="680" y1="137" y2="137" stroke="#e2e8f0" stroke-width="1"/><rect width="24" height="24" x="328" y="100" fill="#2f54a5" rx="5"/><text x="364" y="117" fill="#334155" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">Quick Draft</text><g clip-path="url(#cbTileClip)"><rect width="372" height="158" x="308" y="138" fill="#f8fafc"/><line x1="308" x2="680" y1="138" y2="138" stroke="#e2e8f0" stroke-width="1"/><line x1="324" x2="664" y1="164" y2="164" stroke="#cbd5e1" stroke-width="1.5"/><line x1="324" x2="664" y1="186" y2="186" stroke="#cbd5e1" stroke-width="1.5"/><line x1="324" x2="600" y1="208" y2="208" stroke="#cbd5e1" stroke-width="1.5"/><rect width="372" height="38" x="308" y="258" fill="#eef2fb"/><text x="324" y="282" fill="#2f54a5" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600">Save Draft</text></g><text x="664" y="252" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic" text-anchor="end">no padding</text><text x="494" y="322" fill="#1d6b5a" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" text-anchor="middle">presentation: content-bleed</text></svg>